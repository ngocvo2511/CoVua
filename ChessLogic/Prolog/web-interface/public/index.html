<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prolog Chess Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>♔ Prolog Chess Game ♛</h1>
        <div class="header-info">
          <div class="game-mode">Human vs Computer</div>
          <div class="ai-depth">AI Depth: <span id="ai-depth">3</span></div>
        </div>
      </header>

      <div class="game-area">
        <div class="game-info">
          <div class="info-panel">
            <div class="turn-indicator">
              <span class="turn-label">Current Turn:</span>
              <span id="current-turn" class="turn-color">White</span>
            </div>
            <div id="game-status" class="game-status">Game in progress</div>
            <div class="move-counter">
              Moves: <span id="move-counter">0</span>
            </div>
          </div>

          <div class="controls">
            <button class="btn btn-primary" onclick="initGame()">
              🔄 New Game
            </button>
            <button
              class="btn btn-secondary"
              onclick="makeBotMove()"
              id="bot-btn"
            >
              🤖 Bot Move
            </button>
            <button class="btn btn-secondary" onclick="undoMove()">
              ↶ Undo
            </button>
            <button class="btn btn-secondary" onclick="refreshBoard()">
              🔍 Refresh
            </button>
          </div>
        </div>

        <div class="board-container">
          <div class="board-labels">
            <div class="files">
              <span>a</span><span>b</span><span>c</span><span>d</span>
              <span>e</span><span>f</span><span>g</span><span>h</span>
            </div>
          </div>

          <div class="board-wrapper">
            <div class="ranks">
              <span>8</span><span>7</span><span>6</span><span>5</span>
              <span>4</span><span>3</span><span>2</span><span>1</span>
            </div>

            <div class="chess-board" id="chessboard">
              <!-- 64 squares will be generated by JavaScript -->
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-panel">
        <div class="captured-pieces">
          <div class="captured-white">
            <h4>Captured White Pieces</h4>
            <div id="captured-white" class="pieces-list"></div>
          </div>
          <div class="captured-black">
            <h4>Captured Black Pieces</h4>
            <div id="captured-black" class="pieces-list"></div>
          </div>
        </div>

        <div class="game-log">
          <h4>Game Log</h4>
          <div class="log-content" id="gameLog"></div>
          <button class="btn btn-small" onclick="clearLog()">Clear Log</button>
        </div>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <div>Processing...</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
